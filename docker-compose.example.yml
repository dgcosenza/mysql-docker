# Example production deployment for dgcosenza/mysql:8.4
# Copy to docker-compose.yml and provide credentials via .env or Docker secrets.

services:
  mysql:
    image: dgcosenza/mysql:8.4
    container_name: mysql84
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_add:
      - SYS_NICE
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2048M
        reservations:
          memory: 256M
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-app}
      - MYSQL_USER=${MYSQL_USER:-app}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./conf.d:/etc/mysql/conf.d:ro
      - ./initdb.d:/docker-entrypoint-initdb.d:ro
    networks:
      - db_internal
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      start_interval: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  mysql_data:

networks:
  db_internal:
    driver: bridge
    internal: true
